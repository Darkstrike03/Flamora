name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.6"
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.6"
          cache: true
      - name: Ensure Android SDK packages
        run: |
          yes | sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" || true
      - run: flutter pub get
      - run: flutter build apk --debug --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: build/app/outputs/flutter-apk/*-debug.apk
          retention-days: 5

  windows:
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.6"
          cache: true
      - run: flutter pub get
      # audiotags' CMake downloads+extracts windows.tar.gz inside its own
      # package dir, which Flutter mounts as a symlink — libarchive refuses
      # to extract through it on fresh caches. Pre-extract at the resolved
      # real path so CMake's `if(NOT EXISTS audiotags.dll)` skips its own
      # extract. Version must match pubspec.yaml and the plugin's CMake.
      - name: Pre-extract audiotags Windows binaries
        shell: pwsh
        run: |
          $link = Get-Item windows/flutter/ephemeral/.plugin_symlinks/audiotags
          $target = $link.Target
          if ($target -is [array]) { $target = $target[0] }
          $dir = Join-Path $target 'windows'
          if (-not (Test-Path (Join-Path $dir 'audiotags.dll'))) {
            $tgz = Join-Path $dir 'windows.tar.gz'
            if (-not (Test-Path $tgz)) {
              Invoke-WebRequest -Uri 'https://github.com/erikas-taroza/audiotags/releases/download/v1.4.5/windows.tar.gz' -OutFile $tgz
            }
            tar -xzf $tgz -C $dir
          }
      # Validation build only (release artifacts ship from release.yml).
      - run: flutter build windows --release
